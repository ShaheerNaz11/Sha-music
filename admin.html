<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Streamify</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Top Bar -->
        <header class="top-bar">
            <a href="index.html" class="icon-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <h1 class="logo">Admin Dashboard</h1>
            <div style="width: 24px;"></div>
        </header>

        <main class="content admin-container">
            <section class="section fade-in-up">
                <h2 class="section-title" id="formTitle">Add New Song</h2>
                <form id="songForm">
                    <input type="hidden" id="songId">
                    <div class="form-group">
                        <label>Song Title</label>
                        <input type="text" id="title" required placeholder="Enter song title">
                    </div>
                    <div class="form-group">
                        <label>Artist</label>
                        <input type="text" id="artist" required placeholder="Enter artist name">
                    </div>
                    <div class="form-group">
                        <label>Album</label>
                        <input type="text" id="album" placeholder="Enter album name (optional)">
                    </div>
                    <div class="form-group">
                        <label>Cover Image URL</label>
                        <input type="url" id="cover_url" required placeholder="https://example.com/image.jpg">
                    </div>
                    <div class="form-group">
                        <label>Cloudinary Audio URL</label>
                        <input type="url" id="audio_url" required placeholder="https://res.cloudinary.com/.../song.mp3">
                    </div>
                    <button type="submit" class="btn-primary" id="submitBtn">Save Song</button>
                    <button type="button" class="btn-primary" id="cancelBtn" style="background: #333; margin-top: 10px; display: none;">Cancel Edit</button>
                </form>
            </section>

            <section class="section fade-in-up" style="animation-delay: 0.2s;">
                <h2 class="section-title">Manage Songs</h2>
                <div class="admin-song-list" id="adminSongList">
                    <!-- Rendered via JS -->
                </div>
            </section>
        </main>
    </div>

    <script src="config.js"></script>
    <script src="admin.js"></script>
</body>
</html>
